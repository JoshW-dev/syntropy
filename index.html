<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Syntropy</title>
    <meta name="description" content="Cells on a lattice become organisms, then tribes, hierarchies and governments, with no rule that names any of them. A 3D emergence simulation that runs in your browser, with a paper on how it works." />
    <meta name="theme-color" content="#F8F8F8" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Syntropy" />
    <meta property="og:description" content="Cells become organisms, then tribes, hierarchies and governments, with no rule that names any of them." />
    <meta property="og:url" content="https://syntropy-sim.vercel.app/" />
    <meta property="og:image" content="https://syntropy-sim.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Paint a chosen dark or tinted look before the app loads, so it doesn't flash paper first.
      try {
        var look = new URLSearchParams(location.search).get('look') || localStorage.getItem('syntropy.look');
        var ground = { night: '#0a0c12', blueprint: '#163c70', ink: '#f1ebdd', nebula: '#04050a' }[look];
        if (ground) document.documentElement.style.setProperty('--ground', ground);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="stage" id="stage">
    <canvas id="scene" aria-label="A 3D simulation of cells, organisms and realms"></canvas>

    <header class="mast">
      <h1>Syntropy</h1>
      <p>Order from simple rules</p>
    </header>

    <ol class="ladder" id="ladder" aria-label="Levels of emergence"></ol>

    <section class="chronicle" id="chronicle" aria-live="polite" aria-label="Chronicle"></section>

    <nav class="controls" aria-label="Simulation controls">
      <button id="pause" class="btn icon" aria-label="Pause" title="Pause (space)">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><rect class="g-pause" x="5" y="4" width="3.2" height="12" rx="1" /><rect class="g-pause" x="11.8" y="4" width="3.2" height="12" rx="1" /><path class="g-play" d="M6 4.2v11.6c0 .6.6 1 1.1.7l9.2-5.8c.5-.3.5-1 0-1.3L7.1 3.5C6.6 3.2 6 3.6 6 4.2z" /></svg>
      </button>
      <div class="speed" id="speed" role="radiogroup" aria-label="Speed">
        <button role="radio" data-speed="1">1×</button>
        <button role="radio" data-speed="2">2×</button>
        <button role="radio" data-speed="4">4×</button>
        <button role="radio" data-speed="8">8×</button>
      </div>
      <button id="skip" class="btn" title="Skip ahead to organisms">Skip</button>
      <button id="new" class="btn" title="New world (N)" aria-label="New world">New<span class="wide"> world</span></button>
      <button id="share" class="btn" title="Copy a link to this world">Share</button>
      <div class="look" id="look">
        <button id="look-btn" class="btn duo" aria-label="Look" aria-expanded="false" aria-controls="look-pop" title="Look and what to show">
          <svg class="ico" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M10 3.6a6.4 6.4 0 0 1 0 12.8z" /></svg>
          <span class="txt">Look</span>
        </button>
        <div class="pop" id="look-pop" role="dialog" aria-label="Look" hidden>
          <div class="pop-group" role="radiogroup" aria-labelledby="look-h">
            <p class="pop-h" id="look-h">Look</p>
            <div class="pop-list" id="look-list"></div>
          </div>
          <div class="pop-group" role="group" aria-labelledby="show-h">
            <p class="pop-h" id="show-h">Show</p>
            <div class="pop-list">
              <label class="check"><input type="checkbox" data-show="chronicle" checked /><span class="box" aria-hidden="true"></span>Chronicle</label>
              <label class="check"><input type="checkbox" data-show="lines" checked /><span class="box" aria-hidden="true"></span>Command lines</label>
              <label class="check"><input type="checkbox" data-show="rings" checked /><span class="box" aria-hidden="true"></span>Ruler rings</label>
              <label class="check"><input type="checkbox" data-show="food" checked /><span class="box" aria-hidden="true"></span>Food</label>
            </div>
          </div>
          <div class="pop-group">
            <button id="hide-ui" class="pop-row" title="Hide everything but the world (H)">Hide UI<kbd>H</kbd></button>
          </div>
        </div>
      </div>
      <button id="env-btn" class="btn duo" aria-label="Environment" aria-expanded="false" aria-controls="env" title="Environment">
        <svg class="ico" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 6.5h14M3 13.5h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /><circle cx="7.5" cy="6.5" r="2.4" /><circle cx="12.5" cy="13.5" r="2.4" /></svg>
        <span class="txt">Environment</span>
      </button>
    </nav>

    <aside class="env" id="env" role="dialog" aria-modal="false" aria-labelledby="env-title">
      <div class="env-head">
        <h2 id="env-title">Environment</h2>
        <button id="env-close" class="btn icon" aria-label="Close environment" title="Close (Esc)">
          <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
        </button>
      </div>
      <p class="env-note">Changes apply now, and Share links keep them.</p>
      <div id="env-knobs"></div>
      <div class="env-actions">
        <button id="env-restart" class="btn">Restart world with these settings</button>
        <button id="env-reset" class="text-btn">Reset to defaults</button>
      </div>
    </aside>

    <button id="show-ui" class="show-ui" title="Show UI (H)" hidden>Show UI</button>

    <dl class="readout" id="readout"></dl>

    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="tip" id="tip" hidden></div>

    <footer class="foot">
      <span class="links">
        <a href="/paper/" id="paper-link">Paper</a>
        <a href="https://github.com/JoshW-dev/syntropy" target="_blank" rel="noopener">GitHub</a>
      </span>
      <span id="seed-label"></span>
    </footer>
    </div>

    <!-- On wide screens the paper reads beside the world. Either side collapses to a tab on its edge. -->
    <div class="divider" id="divider" hidden>
      <div class="div-pair">
        <button id="fold-sim" class="div-btn" aria-label="Collapse the simulation" title="Collapse the simulation">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" /></svg>
        </button>
        <button id="fold-paper" class="div-btn" aria-label="Collapse the paper" title="Collapse the paper (P)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" /></svg>
        </button>
      </div>
      <button id="open-paper" class="div-tab" title="Read the paper beside the world (P)">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" /></svg><span>Paper</span>
      </button>
      <button id="open-sim" class="div-tab" title="Show the simulation beside the paper">
        <span>Simulation</span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" /></svg>
      </button>
    </div>
    <aside class="paper-pane" id="paper-pane" aria-label="The paper" hidden>
      <iframe id="paper-frame" title="Syntropy: From Cells to Government"></iframe>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
