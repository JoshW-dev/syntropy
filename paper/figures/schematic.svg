<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#444">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <!-- panel titles -->
  <g font-size="14" font-weight="600" fill="#333">
    <text x="95" y="28" text-anchor="middle">Lattice</text>
    <text x="320" y="28" text-anchor="middle">Form</text>
    <text x="555" y="28" text-anchor="middle">Organisms</text>
    <text x="790" y="28" text-anchor="middle">Polity</text>
  </g>
  <!-- 1. noisy lattice: scattered cells in lineage colours -->
  <g stroke="#555" stroke-width="1">
    <rect x="30" y="60" width="12" height="12" fill="#5EAAD4"/><rect x="44" y="60" width="12" height="12" fill="#5EAAD4"/><rect x="72" y="60" width="12" height="12" fill="#5EAAD4"/>
    <rect x="30" y="88" width="12" height="12" fill="#5EAAD4"/><rect x="58" y="74" width="12" height="12" fill="#5EAAD4"/><rect x="100" y="60" width="12" height="12" fill="#D45E5E"/>
    <rect x="114" y="74" width="12" height="12" fill="#D45E5E"/><rect x="128" y="88" width="12" height="12" fill="#D45E5E"/><rect x="142" y="74" width="12" height="12" fill="#D45E5E"/>
    <rect x="44" y="116" width="12" height="12" fill="#FCD561"/><rect x="58" y="130" width="12" height="12" fill="#FCD561"/><rect x="86" y="116" width="12" height="12" fill="#FCD561"/>
    <rect x="72" y="144" width="12" height="12" fill="#FCD561"/><rect x="114" y="130" width="12" height="12" fill="#78AD6C"/><rect x="128" y="144" width="12" height="12" fill="#78AD6C"/>
    <rect x="142" y="130" width="12" height="12" fill="#78AD6C"/><rect x="100" y="158" width="12" height="12" fill="#78AD6C"/><rect x="30" y="158" width="12" height="12" fill="#FCD561"/>
  </g>
  <text x="95" y="200" text-anchor="middle" font-size="12">born on 7 or 8 neighbours,</text>
  <text x="95" y="216" text-anchor="middle" font-size="12">survives on 1 to 5</text>
  <!-- arrow 1 -->
  <line x1="172" y1="112" x2="252" y2="112" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="212" y="102" text-anchor="middle" font-size="12">holds its shape</text>
  <text x="212" y="130" text-anchor="middle" font-size="12">20 generations</text>
  <!-- 2. a form -->
  <g stroke="#555" stroke-width="1" fill="#5EAAD4">
    <rect x="290" y="80" width="14" height="14"/><rect x="304" y="80" width="14" height="14"/><rect x="318" y="94" width="14" height="14"/>
    <rect x="290" y="94" width="14" height="14"/><rect x="304" y="94" width="14" height="14"/><rect x="304" y="108" width="14" height="14"/>
    <rect x="318" y="108" width="14" height="14"/><rect x="332" y="108" width="14" height="14"/><rect x="318" y="122" width="14" height="14"/>
  </g>
  <text x="320" y="200" text-anchor="middle" font-size="12">its cells become</text>
  <text x="320" y="216" text-anchor="middle" font-size="12">one body, in place</text>
  <!-- arrow 2 -->
  <line x1="372" y1="112" x2="452" y2="112" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="412" y="102" text-anchor="middle" font-size="12">comes loose</text>
  <!-- 3. organisms: three bodies with motion hints -->
  <g stroke="#555" stroke-width="1">
    <g fill="#5EAAD4"><rect x="480" y="70" width="10" height="10"/><rect x="490" y="70" width="10" height="10"/><rect x="490" y="80" width="10" height="10"/><rect x="500" y="80" width="10" height="10"/></g>
    <g fill="#D45E5E"><rect x="560" y="96" width="10" height="10"/><rect x="570" y="96" width="10" height="10"/><rect x="570" y="106" width="10" height="10"/><rect x="580" y="106" width="10" height="10"/><rect x="560" y="106" width="10" height="10"/></g>
    <g fill="#FCD561"><rect x="500" y="134" width="10" height="10"/><rect x="510" y="134" width="10" height="10"/><rect x="510" y="144" width="10" height="10"/></g>
  </g>
  <g stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <path d="M466 78 L476 78"/><path d="M546 104 L556 104"/><path d="M486 142 L496 142"/>
  </g>
  <text x="555" y="200" text-anchor="middle" font-size="12">eat, grow a cell, split,</text>
  <text x="555" y="216" text-anchor="middle" font-size="12">fight, age, die</text>
  <!-- arrow 3 -->
  <line x1="622" y1="112" x2="702" y2="112" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="662" y="102" text-anchor="middle" font-size="12">choose a leader</text>
  <!-- 4. polity: a hanging tree -->
  <g stroke="#1F6AEA" stroke-width="1.4">
    <line x1="790" y1="62" x2="752" y2="102"/><line x1="790" y1="62" x2="790" y2="104"/><line x1="790" y1="62" x2="830" y2="102"/>
    <line x1="752" y1="102" x2="736" y2="142"/><line x1="752" y1="102" x2="764" y2="144"/><line x1="830" y1="102" x2="822" y2="144"/><line x1="830" y1="102" x2="848" y2="142"/>
  </g>
  <circle cx="790" cy="62" r="16" fill="none" stroke="#555" stroke-width="1.2"/>
  <g stroke="#555" stroke-width="1">
    <rect x="784" y="56" width="12" height="12" fill="#5EAAD4"/>
    <rect x="747" y="97" width="10" height="10" fill="#5EAAD4"/><rect x="785" y="99" width="10" height="10" fill="#5EAAD4"/><rect x="825" y="97" width="10" height="10" fill="#D45E5E"/>
    <rect x="731" y="137" width="9" height="9" fill="#5EAAD4"/><rect x="759" y="139" width="9" height="9" fill="#FCD561"/><rect x="817" y="139" width="9" height="9" fill="#D45E5E"/><rect x="843" y="137" width="9" height="9" fill="#D45E5E"/>
  </g>
  <text x="790" y="200" text-anchor="middle" font-size="12">follow whoever keeps you</text>
  <text x="790" y="216" text-anchor="middle" font-size="12">safest, after tax</text>
</svg>
